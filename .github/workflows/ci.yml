
name: React Docker CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  test:
    name: React Docker CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.dev -t ojasvi9/docker-react .

      - name: Run tests with coverage
        run: docker run --rm -e CI=true ojasvi9/docker-react npm run test -- --coverage

  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "deploy.zip"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_SECRET_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY_ }}
          application_name: docker
          environment_name: Docker-env
          region: ap-southeast-2
          deployment_package: deploy.zip
          bucket_name: elasticbeanstalk-ap-southeast-2-167730044117
          bucket_path: docker
