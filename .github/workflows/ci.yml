
name: React Docker CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.dev -t ojasvi9/docker-react .

      - name: Run tests with coverage
        run: docker run --rm -e CI=true ojasvi9/docker-react npm run test -- --coverage
